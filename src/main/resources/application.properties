spring.application.name=portfoliosync-api
spring.datasource.password=${DB_PASSWORD:portfoliosync}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfoliosync}
spring.datasource.username=${DB_USERNAME:portfoliosync}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
github.api.base-url=${GITHUB_API_URL:https://api.github.com}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}