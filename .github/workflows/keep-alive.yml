name: Keep alive

# Pings the public health endpoint every 10 minutes, so the Render free
# instance (which sleeps after 15 minutes without traffic) stays awake for
# the portfolio site's revalidation.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl -fsS -m 60 https://portfoliosync-api.onrender.com/actuator/health
